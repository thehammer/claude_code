name: knowledge

services:
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: knowledge-docs
    ports:
      - "8080:8000"
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./overrides:/docs/overrides:ro
      # Main docs - mount each subdirectory to avoid nested mount conflicts
      - ./docs/index.md:/docs/docs/index.md:ro
      - ./docs/tags.md:/docs/docs/tags.md:ro
      - ./docs/config:/docs/docs/config:ro
      - ./docs/guides:/docs/docs/guides:ro
      - ./docs/reference:/docs/docs/reference:ro
      - ./docs/sessions:/docs/docs/sessions:ro
      - ./docs/decisions:/docs/docs/decisions:ro
      - ./docs/projects/index.md:/docs/docs/projects/index.md:ro
      # Project docs
      - ~/Code/portal_dev/.claude:/docs/docs/projects/portal_dev:ro
      - ~/Code/carebot/.claude:/docs/docs/projects/carebot:ro
      - ~/Code/payments/.claude:/docs/docs/projects/payments:ro
      - ~/Code/family-portal/.claude:/docs/docs/projects/family-portal:ro
    working_dir: /docs
    command: serve --dev-addr=0.0.0.0:8000
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
